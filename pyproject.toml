[project]
name = "paper2simu"
version = "0.2.0"
description = "Research paper-to-simulation workflow for COMSOL and Ansys Fluent, with isolated MCP routing, evidence review, and native scientific validation; derivative of COMSOL Automatic by Mengzhu Guohe (Douyin)."
authors = [{name = "Mengzhu Guohe (Douyin)"}]
maintainers = [{name = "tsuntungngaing-jtn"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.29.0,<2", "mph>=1.4.0,<2", "numpy>=1.24", "uvicorn>=0.31", "jsonschema>=4.21,<5"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
pdf-search = ["pymupdf>=1.24", "chromadb>=0.4", "sentence-transformers>=2.2"]
figure-analysis = ["pillow>=10", "numpy>=1.24", "pymupdf>=1.24", "pytesseract>=0.3"]

[project.scripts]
paper2simu = "server.main:main"
paper2simu-comsol-mcp = "server.main:main"
comsol-automatic = "server.main:main"
comsol-skill-mcp = "server.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "uncertainty", "rsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
