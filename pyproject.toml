[project]
name = "comsol-automatic"
version = "0.1.0"
description = "作者：抖音 萌猪过河。MCP-only COMSOL automation with classic physics cases; no screen recognition."
authors = [{name = "抖音 萌猪过河"}]
maintainers = [{name = "tsuntungngaing-jtn"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.29.0,<2", "mph>=1.4.0,<2", "numpy>=1.24", "uvicorn>=0.31"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
pdf-search = ["pymupdf>=1.24", "chromadb>=0.4", "sentence-transformers>=2.2"]

[project.scripts]
comsol-automatic = "server.main:main"
comsol-skill-mcp = "server.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
